<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Rekap RSVP</title>
<style>*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui;background:#f4f4f1;color:#1c1c1c}main{max-width:900px;margin:auto;padding:20px}
form,.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}input{flex:1;min-width:180px;padding:12px;font-size:16px;border:1px solid #1c1c1c}button{padding:12px 16px;border:0;background:#1c1c1c;color:#fff;font-size:15px;cursor:pointer}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}.sum div{background:#fff;padding:14px;border:1px solid #ddd}.sum b{display:block;font-size:28px;font-weight:300}
.tw{overflow-x:auto;background:#fff;border:1px solid #ddd}table{border-collapse:collapse;width:100%;min-width:620px}th,td{padding:9px 10px;text-align:left;border-bottom:1px solid #eee;vertical-align:top;font-size:14px}th{background:#fafafa}.no{color:#a00}</style></head><body>
<main><h1>Rekap RSVP</h1>
<form id="lg"><input id="k" type="password" placeholder="Kunci admin (ADMIN_KEY di Apps Script)" autocomplete="current-password"><button>Muat data</button></form>
<p id="msg" role="status"></p><div class="sum" id="sum"></div>
<div class="bar"><input id="q" placeholder="Cari nama atau ucapan…" hidden><button id="csv" hidden>Unduh CSV</button></div>
<div class="tw" id="tw" hidden><table id="tb"></table></div></main>
<script src="data/data.js"></script>
<script>
const U=(window.DATA.backend||{}).url,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let rows=[];$('#k').value=sessionStorage.getItem('k')||'';
if(!U)$('#msg').textContent='backend.url belum diisi di data/data.js.';
$('#lg').onsubmit=async e=>{e.preventDefault();if(!U)return;$('#msg').textContent='Memuat…';
 try{const r=await(await fetch(U+'?aksi=admin&kunci='+encodeURIComponent($('#k').value))).json();if(!r.ok)throw r.error;
  sessionStorage.setItem('k',$('#k').value);rows=r.data.reverse();$('#msg').textContent='';['q','csv','tw'].forEach(i=>$('#'+i).hidden=false);draw()}
 catch(x){$('#msg').textContent='Gagal: '+(x||'tidak bisa terhubung ke backend')}};
$('#q').oninput=draw;
function draw(){const q=$('#q').value.toLowerCase(),h=rows.filter(r=>r.h==='Hadir'),by={};h.forEach(r=>by[r.a]=(by[r.a]||0)+Number(r.j||0));
 $('#sum').innerHTML=`<div><b>${rows.length}</b>Konfirmasi</div><div><b>${h.reduce((s,r)=>s+Number(r.j||0),0)}</b>Orang hadir</div><div><b>${rows.length-h.length}</b>Tidak hadir</div>`+Object.entries(by).map(([a,n])=>`<div><b>${n}</b>${esc(a)}</div>`).join('');
 $('#tb').innerHTML='<tr><th>Waktu</th><th>Nama</th><th>Status</th><th>Acara</th><th>Jml</th><th>Ucapan</th></tr>'+rows.filter(r=>(r.n+' '+r.u).toLowerCase().includes(q)).map(r=>`<tr><td>${esc(new Date(r.t).toLocaleString('id-ID'))}</td><td>${esc(r.n)}</td><td class="${r.h==='Hadir'?'':'no'}">${esc(r.h)}</td><td>${esc(r.a)}</td><td>${esc(r.j)}</td><td>${esc(r.u)}</td></tr>`).join('')}
$('#csv').onclick=()=>{const c=v=>'"'+String(v??'').replace(/^[=+\-@]/,"'$&").replace(/"/g,'""')+'"',
 t=['Waktu,Nama,Kehadiran,Acara,Jumlah,Ucapan',...rows.map(r=>[r.t,r.n,r.h,r.a,r.j,r.u].map(c).join(','))].join('\n'),
 a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='rsvp.csv';a.click()};
</script></body></html>
