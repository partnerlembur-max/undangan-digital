name: Deploy undangan ke GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Siapkan folder publish (tanpa editor, backend, dan dokumen)
        run: |
          mkdir _site
          rsync -a --exclude '_site' --exclude '.git' --exclude '.github' --exclude 'backend' --exclude 'editor.html' --exclude '*.md' ./ _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
